{% extends 'layout/main.html' %}
{% load i18n %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow w-100" style="max-width: 400px;">
        <div class="card-body p-5">
            <h2 class="card-title text-center mb-4">{% trans "Log in" %}</h2>

            {% include 'messages/auth_messages.html' %}

            <form method="POST" action="/login">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">{% trans "Username" %}</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">{% trans "Password" %}</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">{% trans "Log in" %}</button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted">
                {% trans "Don't have an account?" %} <a href="{% url 'register_user' %}">{% trans "Register here" %}</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
